name: iOS IPA (no tests)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  DERIVED_DATA: /tmp/TiebaPureDerivedData

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Release build and bundled notices
        run: |
          xcodebuild -project TiebaPure.xcodeproj -scheme TiebaPure \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            build CODE_SIGNING_ALLOWED=NO
          APP="$DERIVED_DATA/Build/Products/Release-iphoneos/TiebaPure.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")" = 16.0
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/PlugIns/TiebaPureOpenIn.appex/Info.plist")" = 16.0
          load_commands="$(otool -l "$APP/TiebaPure" | awk '/cmd LC_LOAD/{command=$2} /SwiftData.framework/{print command}' | sort -u)"
          test "$load_commands" = LC_LOAD_WEAK_DYLIB
          test -f "$APP/PrivacyInfo.xcprivacy"
          plutil -lint "$APP/PrivacyInfo.xcprivacy"
          test -f "$APP/LICENSE"
          grep -Fq 'GNU GENERAL PUBLIC LICENSE' "$APP/LICENSE"
          test -f "$APP/SwiftProtobuf-Apache-2.0.txt"
          grep -Fq 'Apache License' "$APP/SwiftProtobuf-Apache-2.0.txt"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CADisableMinimumFrameDurationOnPhone' "$APP/Info.plist")" = true
          rm -rf "$RUNNER_TEMP/payload" && mkdir -p "$RUNNER_TEMP/payload"
          cp -R "$APP" "$RUNNER_TEMP/payload/"
          (cd "$RUNNER_TEMP/payload" && zip -qry "$RUNNER_TEMP/TiebaPure_iOS16.ipa" .)
          test -f "$RUNNER_TEMP/TiebaPure_iOS16.ipa"

      - name: Upload unsigned ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiebaPure_iOS16_unsigned_ipa
          path: ${{ runner.temp }}/TiebaPure_iOS16.ipa
